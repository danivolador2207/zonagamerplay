<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZonaGamerPlay - Juegos Gratis Online</title>
<meta name="description" content="Juegos gratis online: arcade, memoria, puzzles, habilidad, carreras y clásicos. Juega directamente desde tu navegador.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#151d3d,#29145c)}
h1{margin:0 0 8px;font-size:34px}header p{margin:0;color:#cbd5ff}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px;background:#10172d;position:sticky;top:0;z-index:5}
nav button,.card button{border:0;border-radius:10px;padding:10px 14px;background:#6d5dfc;color:white;cursor:pointer;font-weight:bold}
nav button:hover,.card button:hover{filter:brightness(1.15)}
main{max-width:1150px;margin:auto;padding:20px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#151d35;border:1px solid #273354;border-radius:16px;padding:18px;min-height:180px;box-shadow:0 8px 25px #0003}
.card h2{margin:8px 0}.card p{color:#b9c2df;min-height:42px}.tag{display:inline-block;background:#26345b;color:#9fb0ff;border-radius:20px;padding:4px 9px;font-size:12px}
.game{display:none;background:#151d35;border-radius:16px;padding:22px;margin-top:20px;text-align:center}.game.active{display:block}
canvas{max-width:100%;background:#070b16;border-radius:12px;border:1px solid #334064}
input{padding:11px;border-radius:9px;border:1px solid #46527b;background:#0d1428;color:#fff}
.msg{margin:14px;font-size:18px;color:#dbe2ff}.grid{display:grid;gap:8px;justify-content:center;margin:18px auto}.cell{width:62px;height:62px;border:0;border-radius:10px;background:#27345b;color:#fff;font-size:24px;cursor:pointer}
.memory .cell{font-size:0}.memory .cell.open{font-size:24px;background:#6d5dfc}.memory .cell.done{font-size:24px;background:#2e9b72}
footer{text-align:center;padding:35px;color:#8792b6}
</style>
</head>
<body>
<header><h1>🎮 ZonaGamerPlay</h1><p>Muchos juegos gratis · juega directamente en tu navegador</p></header>
<nav id="nav"><button onclick="home()">🏠 Todos</button><button onclick="filter('Arcade')">Arcade</button><button onclick="filter('Puzzle')">Puzzle</button><button onclick="filter('Habilidad')">Habilidad</button><button onclick="filter('Clásicos')">Clásicos</button></nav>
<main>
<section id="home"><div class="games" id="cards"></div></section>

<div id="game" class="game"><button onclick="home()">← Volver a juegos</button><h2 id="gt"></h2><div id="area"></div></div>
</main><footer>© ZonaGamerPlay · Juegos para navegador</footer>

<script>
const games=[
["reaction","⚡ Test de Reacción","Habilidad","Pulsa cuando cambie a VERDE."],
["clicker","🖱️ Clicker","Arcade","Haz todos los clics que puedas en 10 segundos."],
["guess","🔢 Adivina el Número","Clásicos","Encuentra el número secreto entre 1 y 100."],
["rps","✊ Piedra, Papel, Tijera","Clásicos","Juega contra el ordenador."],
["memory","🧠 Memoria","Puzzle","Encuentra todas las parejas."],
["math","➕ Reto Matemático","Habilidad","Resuelve operaciones antes de que se acabe el tiempo."],
["snake","🐍 Snake","Arcade","Come la comida y consigue la máxima puntuación."],
["dodge","🚀 Esquiva","Arcade","Muévete y evita los obstáculos."],
["typing","⌨️ Velocidad de Escritura","Habilidad","Escribe la palabra lo más rápido posible."],
["lights","💡 Apaga las Luces","Puzzle","Deja todas las casillas apagadas."],
["2048","🔢 2048 Mini","Puzzle","Combina números con las flechas."],
["connect","⭕ Tres en Raya","Clásicos","Consigue tres en línea."],
["color","🎨 ¿Qué Color Es?","Habilidad","Pulsa el color correcto."],
["coin","🪙 Cara o Cruz","Clásicos","Adivina el lanzamiento."],
["whack","🔨 Atrapa al Topo","Arcade","Pulsa al topo cuando aparezca."]
];

function home(){document.getElementById('home').style.display='block';document.getElementById('game').classList.remove('active');render(games)}
function filter(c){render(games.filter(x=>x[2]==c))}
function render(list){document.getElementById('cards').innerHTML=list.map(g=>`<article class="card"><span class="tag">${g[2]}</span><h2>${g[1]}</h2><p>${g[3]}</p><button onclick="start('${g[0]}')">Jugar ahora</button></article>`).join('')}
function start(id){document.getElementById('home').style.display='none';document.getElementById('game').classList.add('active');let g=games.find(x=>x[0]==id);document.getElementById('gt').textContent=g[1];let a=document.getElementById('area');a.innerHTML='';({reaction,clicker,guess,rps,memory,math,snake,dodge,typing,lights,2048,connect,color,coin,whack}[id])(a)}

function reaction(a){a.innerHTML='<div id="r" style="height:220px;border-radius:15px;background:#7d2635;display:grid;place-items:center;font-size:28px;font-weight:bold;cursor:pointer">ESPERA...</div><div class="msg" id="rm"></div>';let r=a.querySelector('#r'),t;let go=()=>{r.style.background='#218b62';r.textContent='¡PULSA!';t=performance.now()};setTimeout(go,1500+Math.random()*3000);r.onclick=()=>{if(r.textContent==='¡PULSA!'){a.querySelector('#rm').textContent=`Tu tiempo: ${Math.round(performance.now()-t)} ms`;r.onclick=null}else a.querySelector('#rm').textContent='Demasiado pronto. Reinicia el juego.'}}
function clicker(a){a.innerHTML='<h3 id="sc">0</h3><button id="cb" style="font-size:30px;padding:30px">🖱️ ¡CLICK!</button><div class="msg" id="cm">10 segundos</div>';let n=0,end=false;a.querySelector('#cb').onclick=()=>{if(!end)n++;a.querySelector('#sc').textContent=n};let left=10;let z=setInterval(()=>{left--;a.querySelector('#cm').textContent=left+' segundos';if(left<=0){end=true;clearInterval(z);a.querySelector('#cm').textContent='¡Fin! Puntuación: '+n}},1000)}
function guess(a){let n=Math.floor(Math.random()*100)+1,c=0;a.innerHTML='<input id="gi" type="number" min="1" max="100" placeholder="1-100"><button onclick="this.nextElementSibling.textContent=tryG()">Probar</button><div class="msg"></div>';window.tryG=()=>{let x=+document.getElementById('gi').value;c++;return x==n?'🎉 ¡Correcto en '+c+' intentos!':x<n?'⬆️ Más alto':'⬇️ Más bajo'}}
function rps(a){a.innerHTML='<button onclick="playR(0)">✊ Piedra</button> <button onclick="playR(1)">📄 Papel</button> <button onclick="playR(2)">✂️ Tijera</button><div class="msg" id="rp"></div>';window.playR=x=>{let y=Math.floor(Math.random()*3),names=['Piedra','Papel','Tijera'];let res=x==y?'Empate':(x-y+3)%3==2?'¡Ganaste!':'Perdiste';document.getElementById('rp').textContent=`Tú: ${names[x]} · PC: ${names[y]} · ${res}`}}
function memory(a){let vals=['🍎','🍌','🍒','🍋','🍉','🥝','🍇','🥥'];let deck=[...vals,...vals].sort(()=>Math.random()-.5),open=[],done=0;a.innerHTML='<div class="grid memory" style="grid-template-columns:repeat(4,62px)">'+deck.map((_,i)=>`<button class="cell" onclick="mem(${i})">?</button>`).join('')+'</div><div class="msg" id="mm"></div>';let cs=[...a.querySelectorAll('.cell')];window.mem=i=>{if(open.includes(i)||cs[i].classList.contains('done')||open.length==2)return;cs[i].textContent=deck[i];cs[i].classList.add('open');open.push(i);if(open.length==2){if(deck[open[0]]==deck[open[1]]){open.forEach(j=>cs[j].classList.add('done'));done+=2;open=[];if(done==16)document.getElementById('mm').textContent='🏆 ¡Completado!'}else setTimeout(()=>{open.forEach(j=>{cs[j].textContent='?';cs[j].classList.remove('open')});open=[]},650)}}}
function math(a){let score=0,time=15;function q(){let x=Math.floor(Math.random()*20)+1,y=Math.floor(Math.random()*20)+1;a.innerHTML=`<h3>⏱️ ${time}s · Puntos: ${score}</h3><h2>${x} + ${y} = ?</h2><input id="ans" type="number"><button id="ab">Responder</button>`;a.querySelector('#ab').onclick=()=>{if(+a.querySelector('#ans').value==x+y)score++;q()}}q();let timer=setInterval(()=>{time--;if(time<=0){clearInterval(timer);a.innerHTML=`<h2>⏰ Fin</h2><div class="msg">Puntuación: ${score}</div>`}},1000)}
function snake(a){a.innerHTML='<canvas id="cv" width="400" height="400"></canvas><div class="msg">Usa las flechas del teclado</div>';let c=a.querySelector('#cv'),x=c.getContext('2d'),s=20,body=[{x:200,y:200}],d={x:s,y:0},food={x:100,y:100},score=0,run=true;document.onkeydown=e=>{if(e.key=='ArrowUp'&&d.y==0)d={x:0,y:-s};if(e.key=='ArrowDown'&&d.y==0)d={x:0,y:s};if(e.key=='ArrowLeft'&&d.x==0)d={x:-s,y:0};if(e.key=='ArrowRight'&&d.x==0)d={x:s,y:0}};function loop(){if(!run)return;let h={x:body[0].x+d.x,y:body[0].y+d.y};if(h.x<0||h.y<0||h.x>=400||h.y>=400||body.some(p=>p.x==h.x&&p.y==h.y)){run=false;return a.querySelector('.msg').textContent='💥 Fin. Puntuación: '+score}body.unshift(h);if(h.x==food.x&&h.y==food.y){score++;food={x:Math.floor(Math.random()*20)*s,y:Math.floor(Math.random()*20)*s}}else body.pop();x.clearRect(0,0,400,400);x.fillText('🍎',food.x,food.y+18);body.forEach(p=>x.fillRect(p.x,p.y,18,18));setTimeout(loop,100)}loop()}
function dodge(a){a.innerHTML='<canvas id="dc" width="500" height="300"></canvas><div class="msg">Mueve el ratón dentro del juego para esquivar.</div>';let c=a.querySelector('#dc'),x=c.getContext('2d'),px=230,obs=[],alive=true;c.onmousemove=e=>px=e.offsetX;function loop(){if(!alive)return;obs.push({x:Math.random()*480,y:-20});obs.forEach(o=>o.y+=4);obs=obs.filter(o=>o.y<320);x.clearRect(0,0,500,300);x.fillRect(px-20,270,40,15);obs.forEach(o=>x.fillRect(o.x,o.y,20,20));if(obs.some(o=>o.y>250&&o.x<px+20&&o.x+20>px-20)){alive=false;a.querySelector('.msg').textContent='💥 ¡Te han dado!';return}requestAnimationFrame(loop)}loop()}
function typing(a){let words=['galaxia','videojuego','aventura','velocidad','planeta','dragon','cohete','puzzle'];let w=words[Math.floor(Math.random()*words.length)],t=Date.now();a.innerHTML=`<h2>${w}</h2><input id="tw" autofocus><div class="msg"></div>`;a.querySelector('#tw').oninput=e=>{if(e.target.value==w){let ms=Date.now()-t;a.querySelector('.msg').textContent='⚡ '+ms+' ms';}}}
function lights(a){let n=25;a.innerHTML='<div class="grid" style="grid-template-columns:repeat(5,48px)">'+Array.from({length:n},(_,i)=>`<button class="cell" onclick="light(${i})"></button>`).join('')+'</div><div class="msg" id="lm">Enciende/apaga casillas</div>';let cs=[...a.querySelectorAll('.cell')];cs.forEach(c=>{if(Math.random()<.35)c.dataset.on=1;c.style.background=c.dataset.on?'#e6c84f':''});window.light=i=>{let r=Math.floor(i/5),col=i%5;[i,i-5,i+5,i-1,i+1].forEach(j=>{if(j>=0&&j<25&&Math.floor(j/5)==r||j==i-5||j==i+5){if(j>=0&&j<25){cs[j].dataset.on=cs[j].dataset.on?'':'1';cs[j].style.background=cs[j].dataset.on?'#e6c84f':''}}});if(cs.every(c=>!c.dataset.on))document.getElementById('lm').textContent='🏆 ¡Lo conseguiste!' }}
function 2048(a){let b=Array(16).fill(0);b[Math.floor(Math.random()*16)]=2;b[Math.floor(Math.random()*16)]=4;draw();a.innerHTML='<div id="board" class="grid" style="grid-template-columns:repeat(4,70px)"></div><div class="msg">Usa las flechas</div>';function draw(){let q=document.getElementById('board');if(!q)return;q.innerHTML=b.map(v=>`<div class="cell" style="display:grid;place-items:center">${v||''}</div>`).join('')}document.onkeydown=e=>{let old=b.join(),dir=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(dir))return;let rows=[0,1,2,3].map(r=>b.slice(r*4,r*4+4));if(dir=='ArrowUp'||dir=='ArrowDown'){rows=[0,1,2,3].map(c=>rows.map(r=>rows[r][c]));if(dir=='ArrowDown')rows.forEach(r=>r.reverse())}else if(dir=='ArrowRight')rows.forEach(r=>r.reverse());rows=rows.map(r=>{r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;r.splice(i+1,1)}return r.concat(Array(4-r.length).fill(0))});if(dir=='ArrowRight'||dir=='ArrowDown')rows.forEach(r=>r.reverse());if(dir=='ArrowUp'||dir=='ArrowDown'){let nb=Array(16).fill(0);rows.forEach((r,c)=>r.forEach((v,i)=>nb[i*4+c]=v));b=nb}else b=rows.flat();if(b.join()!=old){let z=b.map((v,i)=>v?null:i).filter(i=>i!=null);if(z.length)b[z[Math.floor(Math.random()*z.length)]]=2;draw()}}}
function connect(a){let b=Array(9).fill(''),turn='X';a.innerHTML='<div class="grid" style="grid-template-columns:repeat(3,70px)">'+b.map((_,i)=>`<button class="cell" onclick="tic(${i})"></button>`).join('')+'</div><div class="msg" id="tm"></div>';let cs=[...a.querySelectorAll('.cell')];window.tic=i=>{if(b[i])return;b[i]=turn;cs[i].textContent=turn;if(win(turn)){document.getElementById('tm').textContent='🏆 '+turn+' gana';return}if(b.every(Boolean)){document.getElementById('tm').textContent='Empate';return}turn=turn=='X'?'O':'X'}}function win(t){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(r=>r.every(i=>b[i]==t))}
function color(a){let cols=[['ROJO','red'],['AZUL','blue'],['VERDE','green'],['AMARILLO','gold']];let c=cols[Math.floor(Math.random()*4)];a.innerHTML=`<h2 style="color:${c[1]}">¿${c[0]}?</h2>${cols.map(x=>`<button onclick="col('${x[0]}','${c[0]}')">${x[0]}</button>`).join('')}<div class="msg" id="co"></div>`;window.col=(x,y)=>document.getElementById('co').textContent=x==y?'✅ Correcto':'❌ Era '+y}
function coin(a){let c=Math.random()<.5?'Cara':'Cruz';a.innerHTML='<button onclick="coinG(\'Cara\')">🙂 Cara</button> <button onclick="coinG(\'Cruz\')">🪙 Cruz</button><div class="msg" id="ci"></div>';window.coinG=x=>document.getElementById('ci').textContent=x==c?'🎉 ¡Acertaste! Salió '+c:'❌ Salió '+c}
function whack(a){a.innerHTML='<div id="holes" class="grid" style="grid-template-columns:repeat(3,70px)">'+Array(9).fill(0).map((_,i)=>`<button class="cell" onclick="hit(${i})"></button>`).join('')+'</div><div class="msg" id="wm">Puntos: 0</div>';let cs=[...a.querySelectorAll('.cell')],p=0,m=Math.floor(Math.random()*9);cs[m].textContent='🐹';window.hit=i=>{if(i==m){p++;cs[m].textContent='';m=Math.floor(Math.random()*9);cs[m].textContent='🐹';document.getElementById('wm').textContent='Puntos: '+p}};setInterval(()=>{cs.forEach(c=>c.textContent='');m=Math.floor(Math.random()*9);cs[m].textContent='🐹'},800)}
home();
</script>
</body></html>
